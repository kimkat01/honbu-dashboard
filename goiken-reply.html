<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ご意見箱 返信（本部）</title>
<!--
  ご意見箱 返信画面（本部用・2026-11-26）
  ・本部ダッシュボードの「ご意見箱」カードから開く
  ・ご意見の一覧 → 1件選んで返信を書く → 返信の範囲を選んで送信
      本人のみ … 記名の投稿者の端末にだけ届く（これまでの返信と同じ）
      この園   … その園の ANSHIN KUN のご意見箱画面「本部からの回答」に載る
      全園     … 全園の ANSHIN KUN のご意見箱画面「本部からの回答」に載る
    ※この園／全園で載るのは「公開用の質問文」と返信だけ（投稿者名・元の本文は載せない）
  ・データは GAS「本部ダッシュボード 件数API」（cryk0289）の goikenList / goikenReply
  ・ログインは本部ダッシュボードと共通（このPCで本部ダッシュボードにログイン済みなら、そのまま使える）
-->
<script src="https://kimkat01.github.io/staff-dashboard/gardens.js"></script>
<style>
:root{--page:#eef2fa;--card:#fff;--ink:#111;--sub:#555;--line:#d5dcec;--acc:#4169e1;--accbg:#e1e8fb;--warn:#c8453a;--warnbg:#fdecea;--ok:#1e824c;--okbg:#e6f5ec;--mute:#8a93a6}
@media (prefers-color-scheme:dark){:root{--page:#10141e;--card:#191f2e;--ink:#e4e9f5;--sub:#a9b2c8;--line:#2a3249;--acc:#7d9cf2;--accbg:#1e2a4d;--warn:#ef7b70;--warnbg:#3a1f1d;--ok:#5fcf8f;--okbg:#17321f;--mute:#6f7890;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--page);color:var(--ink);font-family:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Meiryo",sans-serif;font-size:15px;line-height:1.6}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 18px;background:var(--card);border-bottom:1px solid var(--line)}
.top h1{font-size:19px;margin:0}
.top .sp{margin-left:auto}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:8px;font:inherit;font-size:14px;cursor:pointer;text-decoration:none}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.btn[disabled]{opacity:.5;cursor:default}
.wrap{display:grid;grid-template-columns:minmax(300px,420px) 1fr;gap:14px;padding:14px 18px;height:calc(100vh - 58px)}
@media (max-width:860px){.wrap{grid-template-columns:1fr;height:auto}}
.pane{background:var(--card);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;min-height:0}
.pane-h{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.tab{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:999px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.list{overflow:auto;flex:1}
.item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);padding:10px 12px;font:inherit;cursor:pointer}
.item:hover{background:var(--accbg)}
.item.on{background:var(--accbg);box-shadow:inset 4px 0 0 var(--acc)}
.item .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--sub)}
.item .txt{margin-top:4px;font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chip{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700;background:var(--accbg);color:var(--acc)}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.chip.ok{background:var(--okbg);color:var(--ok)}
.chip.gray{background:transparent;border:1px solid var(--line);color:var(--sub)}
.detail{overflow:auto;padding:16px 18px;flex:1}
.empty{color:var(--mute);padding:30px;text-align:center}
.box{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.box h3{margin:0 0 6px;font-size:14px;color:var(--sub)}
.body{white-space:pre-wrap;font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13.5px;color:var(--sub);margin-bottom:10px}
.row b{color:var(--ink)}
label.lbl{display:block;font-size:14px;font-weight:700;margin:14px 0 6px}
.hint{font-size:12.5px;color:var(--sub);margin-top:4px}
textarea,select{width:100%;font:inherit;font-size:15px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
textarea{min-height:120px;resize:vertical;line-height:1.7}
.scopes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.scope{border:1.5px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;background:var(--card);color:var(--ink);font:inherit;text-align:left}
.scope b{display:block;font-size:15px}
.scope span{font-size:12px;color:var(--sub)}
.scope.on{border-color:var(--acc);background:var(--accbg)}
.scope[disabled]{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:10px;align-items:center;margin-top:16px}
.msg{font-size:14px}
.msg.err{color:var(--warn)} .msg.ok{color:var(--ok)}
.preview{border:1px dashed var(--acc);border-radius:10px;padding:12px;margin-top:14px;background:var(--accbg)}
.preview .pl{font-size:12.5px;font-weight:700;color:var(--acc);margin-bottom:6px}
.gate{max-width:480px;margin:60px auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px;text-align:center}
</style>
</head>
<body>
<div class="top">
  <h1>💬 ご意見箱 返信<span style="font-size:13px;color:var(--sub);font-weight:400">（本部限定）</span></h1>
  <span class="sp"></span>
  <button class="btn" id="reloadBtn" type="button">🔄 更新</button>
  <a class="btn" href="https://docs.google.com/spreadsheets/d/1z3wCamSk7Mjm4hFrP_4D5Q9WKmXOJtUmXuFs0GEdeQI/edit" target="_blank" rel="noopener">📄 スプレッドシートを開く</a>
</div>

<div class="gate" id="gate" hidden>
  <p><b>本部ダッシュボードにログインしてください</b></p>
  <p style="font-size:14px;color:var(--sub)">このPCで本部ダッシュボードにログインしていないか、ログインの有効時間（12時間）が切れています。</p>
  <a class="btn pri" href="./">本部ダッシュボードを開く</a>
</div>

<div class="wrap" id="app" hidden>
  <section class="pane">
    <div class="pane-h">
      <button class="tab on" data-f="todo" type="button">未返信</button>
      <button class="tab" data-f="done" type="button">返信済み</button>
      <button class="tab" data-f="all" type="button">すべて</button>
      <span style="margin-left:auto;font-size:12.5px;color:var(--sub)" id="countLbl"></span>
    </div>
    <div class="list" id="list"><div class="empty">読み込み中…</div></div>
  </section>

  <section class="pane">
    <div class="detail" id="detail"><div class="empty">左の一覧からご意見を選んでください</div></div>
  </section>
</div>

<script>
(function () {
  /* 本部ダッシュボードと同じGAS（件数API）。index.html の AUTH_URL と同じURL */
  var API_URL = 'https://script.google.com/macros/s/AKfycbzJHhK-jajUwamz69kCWfZu6H2-L9Z4_Hos7O5VrQFd_CHVrMH1HT5AvhgzPIBU-Kx4/exec';
  var TOKEN_KEY = 'honbu_token';

  var items = [];
  var filter = 'todo';
  var cur = null;        // 選んでいる投稿
  var scope = '';        // 本人のみ / この園 / 全園

  function $(id) { return document.getElementById(id); }
  function esc(t) { return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function token() {
    try { var t = JSON.parse(localStorage.getItem(TOKEN_KEY) || 'null'); if (t && t.token && t.exp > Date.now()) return t.token; } catch (e) {}
    return '';
  }
  function showGate() { $('gate').hidden = false; $('app').hidden = true; }
  function isDone(x) { return !!x.reply || x.status === '対応済'; }
  function gardenList() { return (typeof GARDEN_MASTER !== 'undefined') ? GARDEN_MASTER.map(function (g) { return g.name; }) : []; }
  function matchGarden(name) {
    if (!name) return '';
    if (typeof findGarden === 'function') { var g = findGarden(name); if (g) return g.name; }
    var n = String(name).replace(/[\s　]/g, '');
    var hit = gardenList().filter(function (x) { return x.replace(/[\s　]/g, '') === n; })[0];
    return hit || '';
  }

  function load() {
    var tk = token();
    if (!tk) { showGate(); return; }
    $('app').hidden = false; $('gate').hidden = true;
    $('list').innerHTML = '<div class="empty">読み込み中…</div>';
    fetch(API_URL + '?action=goikenList&token=' + encodeURIComponent(tk) + '&t=' + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (res) {
        if (res && res.error === 'auth') { showGate(); return; }
        if (!res || !res.ok) throw new Error((res && res.message) || '取得に失敗しました');
        items = res.items || [];
        renderList();
        if (cur) { var again = items.filter(function (x) { return x.code === cur.code; })[0]; if (again) select(again.code); }
      })
      .catch(function (e) { $('list').innerHTML = '<div class="empty">読み込めませんでした。<br>' + esc(e.message) + '</div>'; });
  }

  function renderList() {
    var shown = items.filter(function (x) { return filter === 'all' ? true : filter === 'done' ? isDone(x) : !isDone(x); });
    $('countLbl').textContent = shown.length + '件';
    if (!shown.length) { $('list').innerHTML = '<div class="empty">該当するご意見はありません</div>'; return; }
    $('list').innerHTML = shown.map(function (x) {
      var st = isDone(x)
        ? '<span class="chip ok">返信済' + (x.scope ? '・' + esc(scopeLabel(x)) : '') + '</span>'
        : '<span class="chip warn">未返信</span>';
      return '<button class="item' + (cur && cur.code === x.code ? ' on' : '') + '" data-code="' + esc(x.code) + '" type="button">' +
        '<div class="meta">' + st + '<span>' + esc(x.at) + '</span><span class="chip gray">' + esc(x.mode || '—') + '</span>' +
        (x.category ? '<span>' + esc(x.category) + '</span>' : '') + '</div>' +
        '<div class="txt">' + esc(x.body) + '</div></button>';
    }).join('');
  }
  function scopeLabel(x) {
    if (x.scope === 'この園') return (x.targetGarden || 'この園') + 'へ';
    if (x.scope === '全園') return '全園へ';
    if (x.scope === '本人のみ') return '本人のみ';
    return '';
  }

  function select(code) {
    cur = items.filter(function (x) { return x.code === code; })[0] || null;
    renderList();
    if (!cur) return;
    var x = cur;
    var anon = x.mode === '匿名';
    var g = matchGarden(x.targetGarden || x.garden);
    scope = x.scope || '';
    if (!scope) scope = anon ? 'この園' : '本人のみ';

    $('detail').innerHTML =
      '<div class="row"><span>受付：<b>' + esc(x.at) + '</b></span><span>種別：<b>' + esc(x.mode || '—') + '</b></span>' +
      '<span>カテゴリ：<b>' + esc(x.category || '—') + '</b></span><span>追跡コード：<b>' + esc(x.code) + '</b></span></div>' +
      '<div class="row"><span>園（参考）：<b>' + esc(x.garden || '—') + '</b></span>' +
      (anon ? '' : '<span>投稿者：<b>' + esc(x.name || '—') + '</b></span>') + '</div>' +
      '<div class="box"><h3>ご意見の本文</h3><div class="body">' + esc(x.body) + '</div></div>' +
      (x.reply ? '<div class="box"><h3>送信済みの返信（' + esc(x.repliedAt) + (x.replier ? '・' + esc(x.replier) : '') + '・' + esc(scopeLabel(x) || '範囲未設定') + '）</h3><div class="body">' + esc(x.reply) + '</div></div>' : '') +

      '<label class="lbl">返信の範囲</label>' +
      '<div class="scopes">' +
        '<button class="scope" data-s="本人のみ" type="button"' + (anon ? ' disabled title="匿名の投稿は本人に届けられません"' : '') + '><b>👤 投稿者本人のみ</b><span>' + (anon ? '匿名のため選べません' : '本人の端末にだけ届く') + '</span></button>' +
        '<button class="scope" data-s="この園" type="button"><b>🏫 この園</b><span>選んだ園の職員全員に表示</span></button>' +
        '<button class="scope" data-s="全園" type="button"><b>🌐 全園</b><span>全園の職員全員に表示</span></button>' +
      '</div>' +

      '<div id="gardenWrap"><label class="lbl" for="gSel">返信する園</label>' +
      '<select id="gSel"><option value="">選んでください</option>' +
        gardenList().map(function (n) { return '<option' + (n === g ? ' selected' : '') + '>' + esc(n) + '</option>'; }).join('') +
      '</select><div class="hint">「園（参考）」から自動で選んでいます。違っていたら選び直してください。</div></div>' +

      '<div id="qWrap"><label class="lbl" for="qTxt">公開用の質問文</label>' +
      '<textarea id="qTxt" style="min-height:80px" placeholder="職員に見せる質問文。個人が特定されないよう書き直してください（空欄なら回答だけ載ります）">' + esc(x.question || x.body) + '</textarea>' +
      '<div class="hint">元の本文を入れてあります。名前・クラス名・日付など、投稿者がわかる部分は消すか書き直してください。</div></div>' +

      '<label class="lbl" for="rTxt">返信</label>' +
      '<textarea id="rTxt" placeholder="本部からの返信を書いてください">' + esc(x.reply) + '</textarea>' +

      '<div class="preview" id="pv"></div>' +
      '<div class="actions"><button class="btn pri" id="sendBtn" type="button">' + (x.reply ? '返信を更新する' : '返信を送る') + '</button>' +
      '<span class="msg" id="msg"></span></div>';

    Array.prototype.forEach.call(document.querySelectorAll('.scope'), function (b) {
      b.addEventListener('click', function () { if (b.disabled) return; scope = b.getAttribute('data-s'); applyScope(); });
    });
    ['gSel', 'qTxt', 'rTxt'].forEach(function (id) { $(id).addEventListener('input', preview); });
    $('sendBtn').addEventListener('click', send);
    applyScope();
  }

  function applyScope() {
    Array.prototype.forEach.call(document.querySelectorAll('.scope'), function (b) { b.classList.toggle('on', b.getAttribute('data-s') === scope); });
    $('gardenWrap').hidden = scope !== 'この園';
    $('qWrap').hidden = scope === '本人のみ';
    preview();
  }

  function preview() {
    var pv = $('pv');
    var reply = $('rTxt').value.trim();
    if (scope === '本人のみ') {
      pv.innerHTML = '<div class="pl">届く先：投稿者本人（' + esc(cur.name || '記名') + '）のANSHIN KUNだけ</div>' +
        '<div class="body">' + (reply ? esc(reply) : '<span style="color:var(--mute)">（返信を入力してください）</span>') + '</div>';
      return;
    }
    var to = scope === '全園' ? '全園の職員' : (($('gSel').value || '（園を選んでください）') + 'の職員');
    var q = $('qTxt').value.trim();
    pv.innerHTML = '<div class="pl">職員の画面での見え方（届く先：' + esc(to) + '）</div>' +
      (q ? '<div style="font-size:13px;color:var(--sub)">Q.</div><div class="body" style="margin-bottom:8px">' + esc(q) + '</div>' : '') +
      '<div style="font-size:13px;color:var(--sub)">A. 本部より</div><div class="body">' + (reply ? esc(reply) : '<span style="color:var(--mute)">（返信を入力してください）</span>') + '</div>' +
      (cur.mode !== '匿名' ? '<div class="hint">※記名の投稿者本人にも、これまでどおり個別に届きます。</div>' : '');
  }

  function send() {
    var msg = $('msg');
    var reply = $('rTxt').value.trim();
    var garden = scope === 'この園' ? $('gSel').value : '';
    var question = scope === '本人のみ' ? '' : $('qTxt').value.trim();
    msg.className = 'msg err';
    if (!scope) { msg.textContent = '返信の範囲を選んでください'; return; }
    if (!reply) { msg.textContent = '返信を入力してください'; return; }
    if (scope === 'この園' && !garden) { msg.textContent = '返信する園を選んでください'; return; }
    var to = scope === '全園' ? '全園の職員' : scope === 'この園' ? garden + 'の職員' : '投稿者本人';
    if (!confirm('「' + to + '」に返信を送ります。よろしいですか？')) return;

    var btn = $('sendBtn'); btn.disabled = true;
    msg.className = 'msg'; msg.textContent = '送信中…';
    fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'goikenReply', token: token(), code: cur.code, scope: scope, garden: garden, question: question, reply: reply })
    })
      .then(function (r) { return r.json(); })
      .then(function (res) {
        btn.disabled = false;
        if (res && res.error === 'auth') { showGate(); return; }
        if (!res || !res.ok) { msg.className = 'msg err'; msg.textContent = (res && res.message) || '送信に失敗しました'; return; }
        msg.className = 'msg ok'; msg.textContent = '送信しました（' + res.repliedAt + '）';
        setTimeout(load, 600);
      })
      .catch(function () { btn.disabled = false; msg.className = 'msg err'; msg.textContent = '通信エラーが発生しました'; });
  }

  $('list').addEventListener('click', function (e) {
    var b = e.target.closest('.item'); if (b) select(b.getAttribute('data-code'));
  });
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (t) {
    t.addEventListener('click', function () {
      filter = t.getAttribute('data-f');
      Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (x) { x.classList.toggle('on', x === t); });
      renderList();
    });
  });
  $('reloadBtn').addEventListener('click', load);
  load();
})();
</script>
</body>
</html>
